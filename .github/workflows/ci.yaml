name: FastAPI MLOps CI Pipeline

# 1. Trigger pipeline on every push or pull request to main/master branch
on:
  push:
    branches: "main"
  pull_request:
    branches: "main"
  workflow_dispatch: # Allows manual trigger from GitHub UI button

jobs:
  test-and-build:
    name: Run Pytest & Verify Docker Container
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull repository code onto the GitHub runner
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 with pip caching enabled
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Verify model artifact exists and run automated FastAPI tests
      - name: Verify Model Artifact & Run Pytest
        run: |
          ls -lh models/model.joblib
          pytest -v

      # Step 5: Build the Docker image
      - name: Build Docker Image
        run: |
          docker build -t diabetes-fastapi-app:ci .

      # Step 6: Run Docker container and execute live API smoke tests
      - name: Run Container & Test Live Endpoints
        run: |
          docker run -d -p 8000:8000 --name ci-diabetes-container diabetes-fastapi-app:ci
          sleep 5
          
          echo "--- Testing Health Check Endpoint ---"
          curl --fail -X GET "http://localhost:8000/"
          
          echo -e "\n--- Testing Model Info Endpoint ---"
          curl --fail -X GET "http://localhost:8000/model-info"
          
          echo -e "\n--- Testing Prediction Endpoint ---"
          curl --fail -X POST "http://localhost:8000/predict" \
               -H "Content-Type: application/json" \
               -d '{"Pregnancies": 2, "Glucose": 148, "BloodPressure": 72, "SkinThickness": 35, "Insulin": 0, "BMI": 33.6, "DiabetesPedigreeFunction": 0.627, "Age": 50}'

      # Step 7: Always clean up the container even if a previous step fails
      - name: Stop and Remove Container
        if: always()
        run: |
          docker stop ci-diabetes-container || true
          docker rm ci-diabetes-container || true